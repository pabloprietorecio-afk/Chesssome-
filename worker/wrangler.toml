# Servidor del profesor IA de A Chess Way (docs/profesor-ia.md). Guarda la clave de la API de Claude
# (secreto ANTHROPIC_API_KEY) y construye él mismo la petición: la app solo manda los hechos comprobados.
name = "achessway-profesor"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
MODEL = "claude-haiku-5-5"
MAX_TOKENS = "220"
# La lección paso a paso la escribe un modelo más capaz.
MODEL_TUTOR = "claude-sonnet-5-5"
# El asistente (órdenes del jugador): rápido y barato.
MODEL_ASSISTANT = "claude-haiku-5-5"

# Como mucho 10 peticiones por minuto por IP (más que suficiente para corregir errores de una partida).
[[ratelimits]]
name = "PER_IP"
namespace_id = "4471"

  [ratelimits.simple]
  limit = 10
  period = 60

# El tutor valora cada jugada: hasta 40 peticiones por minuto por IP.
[[ratelimits]]
name = "TUTOR_IP"
namespace_id = "4472"

  [ratelimits.simple]
  limit = 40
  period = 60

# Whisper (dictado), de Workers AI.
[ai]
binding = "AI"

# El asistente y el dictado: hasta 20 por minuto por IP.
[[ratelimits]]
name = "ASSIST_IP"
namespace_id = "4473"

  [ratelimits.simple]
  limit = 20
  period = 60
