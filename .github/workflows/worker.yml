# Despliega el servidor del profesor IA (worker/) en Cloudflare Workers.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  · token de Cloudflare con la plantilla «Edit Cloudflare Workers»
#   CLOUDFLARE_ACCOUNT_ID · el «Account ID» de Cloudflare
#   ANTHROPIC_API_KEY     · la clave de la API de Claude (Claude Console). Solo vive aquí y en Cloudflare.
#   TTS_API_KEY           · (opcional) la clave de DeepInfra para la voz del tutor (Kokoro). Sin ella, la app usa la
#                           voz del sistema del móvil.
name: Servidor del profesor IA

on:
  workflow_dispatch:
  push:
    branches: [main, profesor-ia]
    paths: ["worker/**", ".github/workflows/worker.yml", "godot/data/coach_ai.json"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del servidor
        run: |
          cd worker
          npm ci --no-audit --no-fund
          node --test test.mjs
      - name: Comprobar los secretos
        id: secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ] || [ -z "$K" ]; then
            echo "::warning::Faltan secretos (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o ANTHROPIC_API_KEY): no se despliega."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Subdominio workers.dev (la primera vez)
        if: steps.secrets.outputs.ok == 'true'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain"
          have=$(curl -s -H "Authorization: Bearer $T" "$api" | jq -r '.result.subdomain // empty')
          if [ -n "$have" ]; then echo "Subdominio: $have.workers.dev"; exit 0; fi
          for name in achessway achessway-app achessway-profesor; do
            r=$(curl -s -X PUT -H "Authorization: Bearer $T" -H "content-type: application/json" -d "{\"subdomain\":\"$name\"}" "$api")
            if [ "$(echo "$r" | jq -r .success)" = "true" ]; then echo "Registrado: $name.workers.dev"; exit 0; fi
            echo "No se pudo con $name: $(echo "$r" | jq -c .errors)"
          done
          exit 1
      - name: Desplegar en Cloudflare
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Wrangler 4: la acción instalaba la 3.90, que ignoraba los límites por IP («ratelimits») y no montaba bien
          # el Durable Object de las cuentas (22 nov).
          wranglerVersion: "4"
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Cuenta de servicio de Google Play (verificar compras), si está
        if: steps.secrets.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SA: ${{ secrets.GOOGLE_PLAY_SA }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::Sin GOOGLE_PLAY_SA: el servidor no puede verificar compras (Premium y recargas)."; exit 0; fi
          echo "$SA" | jq -e '.client_email and .private_key' > /dev/null || { echo "GOOGLE_PLAY_SA no parece una clave de cuenta de servicio (JSON)"; exit 1; }
          npm ci --silent
          printf '%s' "$SA" | npx --yes wrangler@4 secret put GOOGLE_PLAY_SA
      - name: Clave de la voz del tutor (Kokoro), si está
        if: steps.secrets.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K: ${{ secrets.TTS_API_KEY }}
        run: |
          if [ -z "$K" ]; then echo "::warning::Sin TTS_API_KEY: el tutor habla con la voz del sistema del móvil, no con la de A Tank Story."; exit 0; fi
          npm ci --silent
          printf '%s' "$K" | npx --yes wrangler@4 secret put TTS_API_KEY
      - name: Probar la voz del tutor desplegada
        if: steps.secrets.outputs.ok == 'true'
        env:
          K: ${{ secrets.TTS_API_KEY }}
        run: |
          [ -n "$K" ] || { echo "Sin TTS_API_KEY: no se prueba."; exit 0; }
          base=$(jq -r .endpoint godot/data/coach_ai.json | sed 's#/profesor$##')
          r=$(curl -s -m 40 -X POST "$base/voz/decir" -H "content-type: application/json" -d '{"text":"Hola. La mejor jugada era Cf3: desarrolla el caballo y defiende e5.","language":"es"}')
          echo "$r" | jq -c '{voice, bytes: ((.audio // "") | length), error, detail}'
          echo "$r" | jq -r '.audio' | base64 -d > voz.mp3
          head -c 3 voz.mp3 | od -An -c
          [ "$(stat -c %s voz.mp3)" -gt 2000 ]
      - name: Probar las cuentas (cupo) en el servidor desplegado
        if: steps.secrets.outputs.ok == 'true'
        run: |
          base=$(jq -r .endpoint godot/data/coach_ai.json | sed 's#/profesor$##')
          c=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          r=$(curl -s -m 20 -X POST "$base/premium/estado" -H "content-type: application/json" -d "{\"cuenta\":\"$c\"}")
          echo "Cuenta nueva: $r"
          echo "$r" | jq -e '.premium == false and .gratis == 40' > /dev/null
          bad=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$base/premium/alta" -H "content-type: application/json" -d "{\"cuenta\":\"$c\",\"token\":\"falso-falso-falso-falso-falso\"}")
          echo "Alta con una compra falsa: $bad (400 si Google la rechaza; 503 si aún no hay cuenta de servicio)"
          [ "$bad" = "400" ] || [ "$bad" = "503" ]
      - name: Probar el servidor desplegado
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url=$(jq -r .endpoint godot/data/coach_ai.json)
          [ -n "$url" ] || { echo "Sin endpoint en coach_ai.json"; exit 0; }
          bad=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$url" -H "content-type: application/json" -d '{"facts":{"fen":"hola","kind":"chiste"}}')
          echo "Petición falsa: $bad (debe ser 400)"; [ "$bad" = "400" ]
          r=$(curl -s -m 30 -X POST "$url" -H "content-type: application/json" -d '{"facts":{"fen":"rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2","kind":"hang","played":"Dh4","better":"Cc6","verified":"Con Dh4 tu dama queda en h4, a tiro del caballo de f3: el rival puede capturarla gratis.","rating":1100,"language":"es"}}')
          echo "Respuesta del profesor: $r"
          echo "$r" | jq -e '.content[0].text | length > 10' > /dev/null
      - name: Probar el tutor desplegado (Stockfish de verdad y lección de Claude)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          base=$(jq -r .endpoint godot/data/coach_ai.json | sed 's#/profesor$##')
          [ -n "$base" ] || { echo "Sin endpoint en coach_ai.json"; exit 0; }
          post() { curl -s -m 40 -X POST "$base$1" -H "content-type: application/json" -d "$2"; }
          FEN="r3kbnr/1bqppp1p/p5p1/p1pPP3/2B5/2N2P2/PPP3PP/R2QK1NR w KQkq - 0 12"
          echo "== 12.Cge2 regalando e5 (respuesta en bruto de Stockfish incluida)"
          r=$(post "/tutor" "{\"fen\":\"$FEN\",\"uci\":\"g1e2\"}")
          echo "TUTOR: $r" | cut -c1-3000
          echo "$r" | jq -e '.verdict' > /dev/null
          echo "== segunda opinión (searchmoves): consultas en bruto"
          d=$(post "/tutor?debug=1" "{\"fen\":\"$FEN\",\"uci\":\"g1e2\"}")
          echo "$d" | jq -c '{verdict, drop, second, n: (.raw | length), moves: [.raw[] | (if type == "array" then (map(select(.type == "bestmove")) | .[0]) else . end) | {move, depth, centipawns, type, error, text}]}' || echo "$d" | cut -c1-1500
          echo "== mate en una para las negras tras 2.g4 (signo del mate)"
          m=$(post "/tutor" '{"fen":"rnbqkbnr/pppp1ppp/8/4p3/8/5P2/PPPPP1PP/RNBQKBNR w KQkq - 0 2","uci":"g2g4"}')
          echo "MATE: $m" | cut -c1-2500
          echo "== lección de Claude"
          played=$(echo "$r" | jq -c '[.lines.played[].uci]')
          best=$(echo "$r" | jq -c '[.lines.best[].uci]')
          verdict=$(echo "$r" | jq -r .verdict)
          l=$(post "/tutor/leccion" "{\"fen\":\"$FEN\",\"uci\":\"g1e2\",\"played\":$played,\"best\":$best,\"verdict\":\"$verdict\",\"win_best\":$(echo "$r" | jq .win_best),\"win_played\":$(echo "$r" | jq .win_played),\"rating\":1100,\"language\":\"es\"}")
          echo "LECCION: $l"
          echo "$l" | jq -e '.played | length > 0' > /dev/null
          echo "== asistente"
          a=$(curl -s -m 40 -X POST "$base/asistente" -H "content-type: application/json" -d '{"text":"empieza una partida en nivel intermedio con negras y pon el tablero de mármol","language":"es","state":{"pantalla":"inicio"}}')
          echo "ASISTENTE: $a"
          echo "$a" | jq -e '.actions | length > 0' > /dev/null
          echo "== pregunta libre (Claude con la herramienta de Stockfish)"
          q=$(curl -s -m 90 -X POST "$base/tutor/pregunta" -H "content-type: application/json" -d "{\"start\":\"$FEN\",\"moves\":[\"g1e2\",\"c7e5\"],\"player\":\"w\",\"question\":\"¿Por qué he perdido el peón de e5? ¿Qué tendría que haber jugado?\",\"rating\":1100,\"language\":\"es\"}")
          echo "PREGUNTA: $q"
          echo "$q" | jq -e '.answer | length > 10' > /dev/null
          echo "== dictado (Whisper): un segundo de silencio, solo para ver que Workers AI responde"
          python3 -c "import wave,base64,io;b=io.BytesIO();w=wave.open(b,'wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(16000);w.writeframes(bytes(32000));w.close();print('{\"audio\":\"%s\",\"language\":\"es\"}'%base64.b64encode(b.getvalue()).decode())" > /tmp/voz.json
          v=$(curl -s -m 40 -X POST "$base/voz" -H "content-type: application/json" --data-binary @/tmp/voz.json)
          echo "VOZ: $v"
          echo "$v" | jq -e 'has("text")' > /dev/null
