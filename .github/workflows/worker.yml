# Despliega el servidor del profesor IA (worker/) en Cloudflare Workers.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  · token de Cloudflare con la plantilla «Edit Cloudflare Workers»
#   CLOUDFLARE_ACCOUNT_ID · el «Account ID» de Cloudflare
#   ANTHROPIC_API_KEY     · la clave de la API de Claude (Claude Console). Solo vive aquí y en Cloudflare.
name: Servidor del profesor IA

on:
  workflow_dispatch:
  push:
    branches: [main, profesor-ia]
    paths: ["worker/**", ".github/workflows/worker.yml", "godot/data/coach_ai.json"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del servidor
        run: |
          cd worker
          npm ci --no-audit --no-fund
          node --test test.mjs
      - name: Comprobar los secretos
        id: secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ] || [ -z "$K" ]; then
            echo "::warning::Faltan secretos (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o ANTHROPIC_API_KEY): no se despliega."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Subdominio workers.dev (la primera vez)
        if: steps.secrets.outputs.ok == 'true'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain"
          have=$(curl -s -H "Authorization: Bearer $T" "$api" | jq -r '.result.subdomain // empty')
          if [ -n "$have" ]; then echo "Subdominio: $have.workers.dev"; exit 0; fi
          for name in achessway achessway-app achessway-profesor; do
            r=$(curl -s -X PUT -H "Authorization: Bearer $T" -H "content-type: application/json" -d "{\"subdomain\":\"$name\"}" "$api")
            if [ "$(echo "$r" | jq -r .success)" = "true" ]; then echo "Registrado: $name.workers.dev"; exit 0; fi
            echo "No se pudo con $name: $(echo "$r" | jq -c .errors)"
          done
          exit 1
      - name: Desplegar en Cloudflare
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Probar el servidor desplegado
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url=$(jq -r .endpoint godot/data/coach_ai.json)
          [ -n "$url" ] || { echo "Sin endpoint en coach_ai.json"; exit 0; }
          bad=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$url" -H "content-type: application/json" -d '{"facts":{"fen":"hola","kind":"chiste"}}')
          echo "Petición falsa: $bad (debe ser 400)"; [ "$bad" = "400" ]
          r=$(curl -s -m 30 -X POST "$url" -H "content-type: application/json" -d '{"facts":{"fen":"rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2","kind":"hang","played":"Dh4","better":"Cc6","verified":"Con Dh4 tu dama queda en h4, a tiro del caballo de f3: el rival puede capturarla gratis.","rating":1100,"language":"es"}}')
          echo "Respuesta del profesor: $r"
          echo "$r" | jq -e '.content[0].text | length > 10' > /dev/null
      - name: Probar el tutor desplegado (Stockfish de verdad y lección de Claude)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          base=$(jq -r .endpoint godot/data/coach_ai.json | sed 's#/profesor$##')
          [ -n "$base" ] || { echo "Sin endpoint en coach_ai.json"; exit 0; }
          post() { curl -s -m 40 -X POST "$base$1" -H "content-type: application/json" -d "$2"; }
          FEN="r3kbnr/1bqppp1p/p5p1/p1pPP3/2B5/2N2P2/PPP3PP/R2QK1NR w KQkq - 0 12"
          echo "== 12.Cge2 regalando e5 (respuesta en bruto de Stockfish incluida)"
          r=$(post "/tutor" "{\"fen\":\"$FEN\",\"uci\":\"g1e2\"}")
          echo "TUTOR: $r" | cut -c1-3000
          echo "$r" | jq -e '.verdict' > /dev/null
          echo "== mate en una para las negras tras 2.g4 (signo del mate)"
          m=$(post "/tutor" '{"fen":"rnbqkbnr/pppp1ppp/8/4p3/8/5P2/PPPPP1PP/RNBQKBNR w KQkq - 0 2","uci":"g2g4"}')
          echo "MATE: $m" | cut -c1-2500
          echo "== lección de Claude"
          played=$(echo "$r" | jq -c '[.lines.played[].uci]')
          best=$(echo "$r" | jq -c '[.lines.best[].uci]')
          verdict=$(echo "$r" | jq -r .verdict)
          l=$(post "/tutor/leccion" "{\"fen\":\"$FEN\",\"uci\":\"g1e2\",\"played\":$played,\"best\":$best,\"verdict\":\"$verdict\",\"win_best\":$(echo "$r" | jq .win_best),\"win_played\":$(echo "$r" | jq .win_played),\"rating\":1100,\"language\":\"es\"}")
          echo "LECCION: $l"
          echo "$l" | jq -e '.played | length > 0' > /dev/null
