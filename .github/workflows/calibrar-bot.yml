name: Medir la fuerza del rival (calibración)

# Partidas de cada nivel del rival de la app (godot/core/bot.gd) contra Stockfish con fuerza limitada
# (UCI_LimitStrength + UCI_Elo, que Stockfish ancla a CCRL 40/4, una lista de motores) y contra los niveles vecinos.
# El ajuste (tools/calibrar/ajustar.py) da el Elo de cada nivel con su margen y se publica en la versión preliminar
# «calibracion-bot». Ojo: la CI es más rápida que un móvil; los niveles que piensan con tope de tiempo pueden
# jugar algo peor en el teléfono.
on:
  workflow_dispatch:
    inputs:
      tandas:
        description: "Tandas (JSON): [{a, b, n}]. Vacío = todas. Las ya hechas están en tools/calibrar/resultados."
        required: false
        default: ""

env:
  GODOT_VERSION: "4.7.2"

jobs:
  partidas:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tandas != '' && inputs.tandas || '[{"a":5,"b":"6","n":40},{"a":5,"b":"0","n":24},{"a":8,"b":"7","n":32},{"a":8,"b":"9","n":32},{"a":10,"b":"1","n":32},{"a":10,"b":"sf:1320","n":24},{"a":10,"b":"11","n":24},{"a":11,"b":"2","n":24},{"a":11,"b":"sf:1320","n":24},{"a":12,"b":"2","n":24},{"a":12,"b":"3","n":24},{"a":12,"b":"sf:1600","n":24}]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Godot y Stockfish
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          echo "uci" | /usr/games/stockfish | grep -E "^id name|UCI_Elo" || true
          mkdir -p ~/godot-dl && cd ~/godot-dl
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          ED=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          W="wget -nv --tries=6 --waitretry=15 --retry-connrefused --retry-on-http-error=429,500,502,503,504"
          $W $BASE/SHA512-SUMS.txt
          $W $BASE/$ED
          grep -E "  $ED$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q $ED && rm $ED
      - name: Importar el proyecto
        run: ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --import > import.log 2>&1 || true
      - name: Jugar
        run: |
          set -o pipefail
          B="${{ matrix.b }}"
          # Con «pa» (candidatos de prueba) el archivo lleva la etiqueta y no entra en el ajuste del Elo.
          ET="${{ matrix.et }}"
          OUT="res-${{ matrix.a }}-${B/:/_}${ET:+-$ET}.json"
          [ -n "$ET" ] && OUT="prueba-$OUT"
          EXTRA=()
          if [ -n '${{ matrix.pa && toJSON(matrix.pa) || '' }}' ]; then EXTRA=(--pa '${{ matrix.pa && toJSON(matrix.pa) || '' }}' --etiqueta "$ET"); fi
          timeout 19000 ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot -s tests/calibrar.gd -- \
            --a ${{ matrix.a }} --b "$B" --partidas ${{ matrix.n }} --stockfish /usr/games/stockfish --salida "$GITHUB_WORKSPACE/$OUT" "${EXTRA[@]}" 2>&1 | tee juego.log
          grep -q "^HECHO" juego.log
          echo "OUT=$OUT" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}

  ajuste:
    needs: partidas
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: resultados
          merge-multiple: true
      - name: Ajustar el Elo de cada nivel
        run: |
          # Las tandas ya hechas (guardadas en el repositorio) que no se han repetido ahora.
          for f in tools/calibrar/resultados/*.json; do [ -e "resultados/$(basename $f)" ] || cp "$f" resultados/; done
          ls resultados
          # Las pruebas de candidatos no entran en el ajuste (no son ningún nivel); se publican aparte.
          mkdir -p pruebas
          mv resultados/prueba-*.json pruebas/ 2>/dev/null || true
          python3 tools/calibrar/ajustar.py resultados/*.json --salida calibracion.json --md calibracion.md
          cat calibracion.md >> $GITHUB_STEP_SUMMARY
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calibracion-bot
          name: A Chess Way · fuerza medida del rival
          prerelease: true
          body_path: calibracion.md
          files: |
            calibracion.json
            calibracion.md
            resultados/*.json
            pruebas/*.json
