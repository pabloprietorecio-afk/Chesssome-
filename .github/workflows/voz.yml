name: Voz del nivel Kids (Kokoro)

# Genera un OGG por frase de tools/voz/lineas.json con Kokoro-82M y los publica en la rama voz-src
# (godot/voz/*.ogg). Las muestras de las tres voces españolas van a la versión preliminar «voces-muestra».
# espeak-ng (GPL-3.0, lo usa Kokoro para el español) solo se instala aquí: no entra en la app.
on:
  push:
    branches: [voz-fetch]
  workflow_dispatch:

env:
  VOZ: ef_dora

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile
      - name: Generar
        run: python tools/voz/generar.py --lineas tools/voz/lineas.json --salida out/godot/voz --voz "$VOZ" --muestras muestras
      - name: Publicar en la rama voz-src
        run: |
          cd out
          du -sh godot/voz
          ls godot/voz | wc -l
          git init -q
          git checkout -q -b voz-src
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Voz Kids ${VOZ} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" voz-src
      - name: Muestras de las voces
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voces-muestra
          name: Chessome · muestras de voz (Kokoro)
          prerelease: true
          body: "Una misma frase con las tres voces españolas de Kokoro-82M (pesos Apache-2.0). La app usa ef_dora mientras no se elija otra."
          files: muestras/*.ogg
