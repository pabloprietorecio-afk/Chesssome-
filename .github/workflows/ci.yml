name: CI

on:
  push:
    # «assets-fetch» y «sonidos-fetch» solo sirven para descargar candidatas (assets.yml, sonidos.yml).
    branches-ignore: [assets-fetch, assets-src, sonidos-fetch, assets-snd, problemas-fetch, problemas-src, voz-fetch, voz-src, voz-exp-fetch, voz-exp-src, voz-idiomas-fetch, voz-idiomas-src, firebase-prueba, firebase-resultado]
  pull_request:
  workflow_dispatch:

# Un empuje nuevo a la misma rama cancela la comprobación anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  web:
    name: Núcleo TypeScript y prototipo web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Incluye el test que comprueba que los datos de oro de Godot están al día con el núcleo TypeScript.
      - run: npm test
      - run: npm run build:single

      - name: Prototipo web en un solo archivo
        uses: actions/upload-artifact@v4
        with:
          name: chessome-web
          path: dist/chessome.html
          retention-days: 14

      # Web de pruebas en GitHub Pages, carpeta /app (la raíz es del cine): …github.io/Chesssome-/app/
      # Se conserva lo que ya haya en la rama gh-pages.
      - name: Web de pruebas en GitHub Pages (/app)
        if: github.ref == 'refs/heads/main'
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if ! git clone -q --depth 1 --branch gh-pages "$URL" _pages; then
            mkdir _pages && cd _pages && git init -q && git checkout -q -b gh-pages && git remote add origin "$URL" && cd ..
          fi
          mkdir -p _pages/app
          cp dist/chessome.html _pages/app/index.html
          touch _pages/.nojekyll
          cd _pages
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Web de pruebas (main): ${GITHUB_SHA::7}" || { echo "Sin cambios"; exit 0; }
          git push -q origin gh-pages

      # Enlace fijo de descarga del prototipo web (se abre desde el móvil; en un artefacto de Claude no puede conectar con Firebase).
      - name: Prototipo web en la versión preliminar «ultima-web»
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-web
          name: "A Chess Way · último prototipo web"
          prerelease: true
          make_latest: false
          body: "Prototipo web de un solo archivo (commit ${{ github.sha }}). Ábrelo en el navegador."
          files: dist/chessome.html
          overwrite_files: true

  reglas:
    name: Reglas de Firebase (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/test/package-lock.json

      - name: Java 21 (el emulador de la base de datos)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Probar las reglas contra el emulador
        working-directory: firebase/test
        run: |
          npm ci
          # El emulador solo admite archivos dentro de su carpeta: una copia de las reglas (la prueba lee las de verdad).
          cp ../database.rules.json .
          npx firebase emulators:exec --only database --project demo-chess "node --test"

  godot:
    name: Godot (reglas y APK de depuración)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Caché de Godot y plantillas de Android
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Descargar Godot y plantillas (comprobando las sumas SHA-512 oficiales)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl/templates && cd ~/godot-dl
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          ED=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          TPZ=Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          W="wget -nv --tries=6 --waitretry=15 --retry-connrefused --retry-on-http-error=429,500,502,503,504"
          $W $BASE/SHA512-SUMS.txt
          $W $BASE/$ED
          $W $BASE/$TPZ
          grep -E "  ($ED|$TPZ)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q $ED && rm $ED
          unzip -q -j $TPZ templates/android_debug.apk templates/android_release.apk templates/version.txt -d templates/
          rm $TPZ
          ls -la ~/godot-dl ~/godot-dl/templates

      - name: Instalar plantillas, firma de depuración y ajustes del editor
        run: |
          set -euo pipefail
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T ~/.config/godot
          cp ~/godot-dl/templates/* $T/
          cat $T/version.txt
          # Firma de depuración fija (android_firma/): cada APK se instala encima del anterior.
          cp android_firma/debug.keystore ~/debug.keystore
          # versionCode creciente: Android solo actualiza a un versionCode igual o mayor.
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" godot/export_presets.cfg
          grep -E "^version/(code|name)" godot/export_presets.cfg
          # La app enseña su versión en Opciones: así se sabe qué APK está instalado.
          echo "{\"version\": \"0.1.${{ github.run_number }}\", \"commit\": \"${GITHUB_SHA::7}\"}" > godot/data/version.json
          cat godot/data/version.json
          V=$(echo $GODOT_VERSION | cut -d. -f1,2)
          for F in editor_settings-$V.tres editor_settings-4.tres; do
          cat > ~/.config/godot/$F <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Importar el proyecto
        run: |
          ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --import 2>&1 | tee import.log | tail -15 || true

      - name: Pruebas de oro (Glicko-2, reglas y explicaciones, frente al núcleo TypeScript y chess.js)
        run: |
          set -o pipefail
          G=~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          for T in test_glicko2 test_chess test_explain test_assessment test_course test_bot test_review test_online test_move_why test_game_detail test_game_log test_captures test_progress test_reminder test_inicio test_cine test_ads test_intro test_cine_film test_cine_video test_dia test_retos test_espera test_niveles test_neon test_reloj test_war test_war_app test_opciones_partida test_volver_analisis test_practica test_repaso_fallos test_defensas test_por_que test_idioma_ventana test_notas test_profesor_ia test_profesor_app test_espera_bot; do
            timeout 600 $G --headless --path godot -s tests/$T.gd 2>&1 | tee $T.log
            # un error de guion no siempre cambia el código de salida: se busca también en la salida
            ! grep -E -q "SCRIPT ERROR|Parse Error|Failed to load script" $T.log
            grep -q "TODO OK" $T.log
          done

      - name: Partida online en la demo (sin red)
        run: |
          set -o pipefail
          timeout 300 ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot -s tests/test_online_ui.gd 2>&1 | tee test_online_ui.log
          ! grep -E -q "SCRIPT ERROR|Parse Error|Failed to load script" test_online_ui.log
          grep -q "TODO OK" test_online_ui.log

      - name: APK de depuración (arm64)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android_firma/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build/android
          A=$GITHUB_WORKSPACE/build/android/Chessome-debug.apk
          ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --export-debug "Android Debug" $A 2>&1 | tail -30
          ls -lh $A
          # Lo que la app lee como archivo suelto tiene que ir dentro del APK.
          MISSING=0
          FIRST=$(python3 -c "import json; print(json.load(open('godot/data/demo_puzzles.json'))['puzzles'][0]['id'])")
          for f in assets/data/demo_puzzles.json assets/data/defensas.json assets/data/version.json assets/data/explain/$FIRST.json assets/sets/fichas/iconos.bin assets/ui/iconos.bin assets/ui/iconos.json assets/ui/emblema.bin assets/data/curso.json assets/board3d/escudo.bin assets/board3d/escudo_roto.bin; do
            if unzip -l $A | grep -q " $f$"; then echo "OK $f"; else echo "FALTA $f"; MISSING=1; fi
          done
          [ "$MISSING" = 0 ]

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: Chessome-debug-apk
          path: build/android/Chessome-debug.apk
          if-no-files-found: error
          retention-days: 14

      # El APK que se publica es el de Gradle (trabajo apk-avisos): un único APK, con avisos y espera online.
      # Este se sigue exportando para comprobar que la exportación sin Gradle funciona y que lleva los archivos.

  # Capturas rápidas de las pantallas 2D (inicio, Entrenar, partida online): unos minutos, en cada cambio de Godot.
  pantallas:
    name: Pantallas 2D (capturas rápidas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Caché de Godot y plantillas de Android
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Descargar Godot (comprobando la suma SHA-512 oficial)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl && cd ~/godot-dl
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          ED=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          W="wget -nv --tries=6 --waitretry=15 --retry-connrefused --retry-on-http-error=429,500,502,503,504"
          $W $BASE/SHA512-SUMS.txt
          $W $BASE/$ED
          grep -E "  $ED$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q $ED && rm $ED

      - name: Renderizador por software (Vulkan) y pantalla virtual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri > /dev/null

      - name: Importar el proyecto
        run: |
          ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --import 2>&1 | tail -5 || true

      - name: Capturas de las pantallas
        run: |
          mkdir -p build/pantallas
          export SHOTS_DIR=$GITHUB_WORKSPACE/build/pantallas
          timeout 900 xvfb-run -a -s "-screen 0 1080x2400x24" ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --path godot --audio-driver Dummy --rendering-driver vulkan --rendering-method mobile --resolution 1080x2400 res://tests/pantallas.tscn > pantallas.log 2>&1 || true
          grep -E "^SHOT|SCRIPT ERROR|Parse Error|^ERROR|^   at:" pantallas.log | head -40 || true
          cp pantallas.log build/pantallas/

      - name: Publicar en la rama ci-pantallas
        if: always()
        run: |
          B=ci-pantallas
          if [ "$GITHUB_REF_NAME" != "main" ]; then B="ci-pantallas-${GITHUB_REF_NAME//\//-}"; fi
          cd build/pantallas
          git init -q
          git checkout -q -b "$B"
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Pantallas de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$B"

      - name: Las pantallas terminaron sin errores
        run: |
          grep -q "PANTALLAS DONE" pantallas.log || { tail -40 pantallas.log; exit 1; }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" pantallas.log; then exit 1; fi

  # Las capturas del 3D tardan mucho (render por CPU), así que van en paralelo y no retrasan el APK.
  # Solo se hacen si el cambio toca algo que afecta al 3D, o si se lanzan a mano (Run workflow).
  capturas:
    name: Capturas del tablero 3D
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Hay cambios que afecten al 3D?
        id: decide
        run: |
          set -u
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> $GITHUB_OUTPUT; echo "Lanzado a mano: se hacen capturas"; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> $GITHUB_OUTPUT; echo "Sin referencia anterior: se hacen capturas"; exit 0
          fi
          CAMBIOS=$(git diff --name-only "$BASE" "$GITHUB_SHA" || true)
          echo "$CAMBIOS"
          if echo "$CAMBIOS" | grep -E -q '^(godot/(board3d|core|ui|demo|sets|textures|fonts)/|godot/tests/shots\.(gd|tscn)$|godot/project\.godot$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> $GITHUB_OUTPUT; echo ">> Cambios en el 3D: se hacen capturas"
          else
            echo "run=false" >> $GITHUB_OUTPUT; echo ">> Sin cambios que afecten al 3D: se omiten las capturas"
          fi

      - name: Caché de Godot y plantillas de Android
        if: steps.decide.outputs.run == 'true'
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Descargar Godot y plantillas (comprobando las sumas SHA-512 oficiales)
        if: steps.decide.outputs.run == 'true' && steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl/templates && cd ~/godot-dl
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          ED=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          TPZ=Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          W="wget -nv --tries=6 --waitretry=15 --retry-connrefused --retry-on-http-error=429,500,502,503,504"
          $W $BASE/SHA512-SUMS.txt
          $W $BASE/$ED
          $W $BASE/$TPZ
          grep -E "  ($ED|$TPZ)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q $ED && rm $ED
          unzip -q -j $TPZ templates/android_debug.apk templates/android_release.apk templates/version.txt -d templates/
          rm $TPZ

      - name: Renderizador por software (Vulkan) y pantalla virtual
        if: steps.decide.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri > /dev/null

      - name: Importar el proyecto
        if: steps.decide.outputs.run == 'true'
        run: |
          ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --import 2>&1 | tee import.log | tail -15 || true

      - name: Capturas del tablero 3D
        if: steps.decide.outputs.run == 'true'
        run: |
          mkdir -p build/shots
          export SHOTS_DIR=$GITHUB_WORKSPACE/build/shots
          timeout 3600 xvfb-run -a -s "-screen 0 540x1200x24" ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --path godot --audio-driver Dummy --rendering-driver vulkan --rendering-method mobile --fixed-fps 30 --resolution 540x1200 res://tests/shots.tscn > shots.log 2>&1 || true
          grep -E "^SHOT|SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR|^   at:" shots.log | head -80 || true
          # War Chess: escudos, casilla roja, botón «Blindar» y fotogramas del golpe.
          timeout 600 xvfb-run -a -s "-screen 0 540x1200x24" ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --path godot --audio-driver Dummy --rendering-driver vulkan --rendering-method mobile --fixed-fps 30 --resolution 540x1200 res://tests/war_shots.tscn > war_shots.log 2>&1 || true
          grep -E "^SHOT|SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR" war_shots.log | head -40 || true
          ls -la build/shots

      - name: Publicar capturas en la rama ci-shots
        if: always() && steps.decide.outputs.run == 'true'
        run: |
          mkdir -p build/shots
          cp shots.log import.log build/shots/ 2>/dev/null || true
          # main publica en ci-shots; las demás ramas, en ci-shots-<rama>, para que dos trabajos en paralelo no se pisen.
          SHOTS_BRANCH=ci-shots
          if [ "$GITHUB_REF_NAME" != "main" ]; then SHOTS_BRANCH="ci-shots-${GITHUB_REF_NAME//\//-}"; fi
          cd build/shots
          git init -q
          git checkout -q -b "$SHOTS_BRANCH"
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$SHOTS_BRANCH"

      - name: Las capturas terminaron y sin errores de guiones ni shaders
        if: steps.decide.outputs.run == 'true'
        run: |
          grep -q "SHOTS DONE" shots.log || { echo "Las capturas no terminaron"; tail -40 shots.log; exit 1; }
          if grep -E "SCRIPT ERROR|SHADER ERROR|Parse Error|Compile Error|Failed to load script" shots.log import.log; then exit 1; fi

  # El APK de la app (desde el 16 nov, el único): compilado con Gradle, con el complemento de notificaciones locales
  # (Notification Scheduler, MIT) y el de esperar rival con la app minimizada (android_espera/). Se publica en el
  # enlace fijo «ultimo-apk» solo si han pasado las pruebas de Godot. versionCode = número de ejecución.
  apk-avisos:
    name: APK (Gradle, con avisos y espera online)
    needs: godot
    if: github.ref_name == 'main' || github.ref_name == 'metaprogresion' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PLUGIN_VERSION: "6.0"
      PLUGIN_SHA256: "806c85eafe8f4c8aa4ee37e0ed1ab551e85db8755f8aeb1c6302092f809725a3"
      # AdMob de Poing Studios (MIT): etiqueta v5.1.0 fijada por su commit; las librerías de Android, por su suma.
      ADMOB_COMMIT: "615974e9f66921a54e3c71c33db0856bdbf19d13"
      ADMOB_TEMPLATE_SHA256: "f7fdf644d50c0e231d8f02ae044057e489d0bcafcf50e908a4858477e7ee05ee"
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Caché de Godot y plantillas (con el código fuente de Android)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-android-gradle-v1

      - name: Descargar Godot y plantillas (comprobando las sumas SHA-512 oficiales)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl/templates && cd ~/godot-dl
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          ED=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          TPZ=Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          W="wget -nv --tries=6 --waitretry=15 --retry-connrefused --retry-on-http-error=429,500,502,503,504"
          $W $BASE/SHA512-SUMS.txt
          $W $BASE/$ED
          $W $BASE/$TPZ
          grep -E "  ($ED|$TPZ)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q $ED && rm $ED
          unzip -q -j $TPZ templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt -d templates/
          rm $TPZ
          ls -la ~/godot-dl ~/godot-dl/templates

      - name: Android SDK (las piezas que pide la compilación con Gradle)
        run: |
          set -uo pipefail
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          ls $SDKM
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.1" "build-tools;36.0.0" "cmake;3.10.2.4988404" "ndk;28.1.13356709" 2>&1 | tail -8 || true
          ls $ANDROID_HOME/build-tools $ANDROID_HOME/platforms

      - name: Plantillas, plantilla Gradle del proyecto, firma y ajustes del editor
        run: |
          set -euo pipefail
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T ~/.config/godot
          cp ~/godot-dl/templates/* $T/
          # Plantilla de Android para Gradle: lo mismo que «Proyecto > Instalar plantilla de compilación de Android».
          mkdir -p godot/android/build
          unzip -q -o ~/godot-dl/templates/android_source.zip -d godot/android/build
          echo -n "${GODOT_VERSION}.stable" > godot/android/.build_version
          touch godot/android/build/.gdignore
          cp android_firma/debug.keystore ~/debug.keystore
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" godot/export_presets.cfg
          sed -i 's/^gradle_build\/use_gradle_build=false/gradle_build\/use_gradle_build=true/' godot/export_presets.cfg
          grep -E "^(version/(code|name)|gradle_build/use_gradle_build)" godot/export_presets.cfg
          echo "{\"version\": \"0.1.${{ github.run_number }}\", \"commit\": \"${GITHUB_SHA::7}\"}" > godot/data/version.json
          V=$(echo $GODOT_VERSION | cut -d. -f1,2)
          for F in editor_settings-$V.tres editor_settings-4.tres; do
          cat > ~/.config/godot/$F <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done

      - name: Plugin de notificaciones (versión fija, con suma SHA-256)
        run: |
          set -euo pipefail
          mkdir -p /tmp/plugin && cd /tmp/plugin
          wget -nv --tries=6 --waitretry=15 --retry-connrefused "https://github.com/godot-mobile-plugins/godot-notification-scheduler/releases/download/v${PLUGIN_VERSION}/NotificationSchedulerPlugin-Android-v${PLUGIN_VERSION}.zip" -O plugin.zip
          echo "${PLUGIN_SHA256}  plugin.zip" | sha256sum -c -
          unzip -q plugin.zip
          mkdir -p $GITHUB_WORKSPACE/godot/addons
          cp -r res/addons/* $GITHUB_WORKSPACE/godot/addons/
          cd $GITHUB_WORKSPACE
          printf '\n[editor_plugins]\n\nenabled=PackedStringArray("res://addons/NotificationSchedulerPlugin/plugin.cfg", "res://addons/espera_online/plugin.cfg", "res://addons/youtube_cine/plugin.cfg")\n' >> godot/project.godot
          tail -4 godot/project.godot
          ls godot/addons

      # Anuncios entre actividades (core/ads.gd). El puente (core/ads_admob.gdtxt) solo se activa aquí, con el plugin
      # instalado: sin él no compilaría. IDs: godot/data/ads.json (de prueba de Google hasta poner los de Pablo).
      - name: Plugin de anuncios (AdMob, Poing Studios; versión fija)
        run: |
          set -euo pipefail
          git clone -q https://github.com/poingstudios/godot-admob-plugin /tmp/admob-src
          git -C /tmp/admob-src checkout -q $ADMOB_COMMIT
          grep -q 'version="5.1.0"' /tmp/admob-src/platforms/godot_editor/addons/admob/plugin.cfg
          cp -r /tmp/admob-src/platforms/godot_editor/addons/admob godot/addons/admob
          wget -nv --tries=6 --waitretry=15 --retry-connrefused "https://github.com/poingstudios/godot-admob-plugin/releases/download/v5.1.0/android-template-v${GODOT_VERSION}.zip" -O /tmp/admob-android.zip
          echo "${ADMOB_TEMPLATE_SHA256}  /tmp/admob-android.zip" | sha256sum -c -
          mkdir -p godot/addons/admob/android/bin
          unzip -q -o /tmp/admob-android.zip -d godot/addons/admob/android/bin
          cat godot/addons/admob/android/bin/package.gd
          cp godot/core/ads_admob.gdtxt godot/core/ads_admob.gd
          APP_ID=$(python3 -c "import json;print(json.load(open('godot/data/ads.json'))['app_id'])")
          grep -q 'res://addons/youtube_cine/plugin.cfg")' godot/project.godot
          sed -i 's|"res://addons/youtube_cine/plugin.cfg")|"res://addons/youtube_cine/plugin.cfg", "res://addons/admob/plugin.cfg")|' godot/project.godot
          printf '\n[admob]\n\ngeneral/android/app_id="%s"\n' "$APP_ID" >> godot/project.godot
          tail -8 godot/project.godot
          if [ "$APP_ID" = "ca-app-pub-3940256099942544~3347511713" ]; then echo "::warning::Los anuncios usan los IDs de PRUEBA de Google (godot/data/ads.json). No publicar así: no generan ingresos."; fi

      # Esperar rival con la app minimizada (android_espera/LEEME.md): el código Java va dentro de la plantilla de
      # Gradle, junto a GodotApp.java; el manifiesto lo completa res://addons/espera_online al exportar.
      - name: Complemento EsperaOnline (Java en la plantilla de Gradle)
        run: |
          set -euo pipefail
          APP=$(find godot/android/build -name GodotApp.java | head -1)
          [ -n "$APP" ]
          ROOT=${APP%/com/godot/game/GodotApp.java}
          mkdir -p $ROOT/com/pabloprieto/espera
          cp android_espera/*.java $ROOT/com/pabloprieto/espera/
          ls -la $ROOT/com/pabloprieto/espera
          # Iconos de los avisos (caballo en blanco para la barra de estado y el icono de la app como imagen grande).
          cp -r android_espera/res/. godot/android/build/res/
          ls godot/android/build/res/drawable-xxhdpi/ godot/android/build/res/drawable-nodpi/
          # Vídeo de los Finales de campeones dentro de la app (android_cine/LEEME.md).
          mkdir -p $ROOT/com/pabloprieto/cine
          cp android_cine/*.java $ROOT/com/pabloprieto/cine/
          ls -la $ROOT/com/pabloprieto/cine

      - name: Importar el proyecto
        run: |
          ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --import 2>&1 | tee import.log | tail -15 || true

      # Las dependencias de Gradle se guardan entre ejecuciones: Maven Central limita las descargas (429).
      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-avisos-${{ hashFiles('godot/android/build/build.gradle', 'godot/android/build/config.gradle') }}
          restore-keys: gradle-avisos-

      - name: APK con avisos (arm64)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android_firma/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android build/avisos-log
          A=$GITHUB_WORKSPACE/build/android/Chessome-debug.apk
          # Hasta 3 intentos, con espera, por si Maven Central corta las descargas (429).
          for i in 1 2 3; do
            ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --export-debug "Android Debug" $A > build/avisos-log/export.log 2>&1 || true
            [ -f $A ] && break
            echo "Intento $i sin APK"; grep -m3 -E "status code|What went wrong" build/avisos-log/export.log || true
            sleep $((i * 60))
          done
          tail -60 build/avisos-log/export.log
          ls -lh $A || true

      - name: Comprobar que el APK lleva el plugin y los archivos de la app
        run: |
          A=build/android/Chessome-debug.apk
          [ -f $A ]
          unzip -l $A > build/avisos-log/apk-contenido.txt
          if unzip -p $A 'classes*.dex' | grep -a -q "org/godotengine/plugin/notification"; then echo "OK plugin dentro del APK"; else echo "FALTA el plugin en el APK"; exit 1; fi
          if unzip -p $A 'classes*.dex' | grep -a -q "com/pabloprieto/espera"; then echo "OK EsperaOnline dentro del APK"; else echo "FALTA EsperaOnline en el APK"; exit 1; fi
          if unzip -p $A 'classes*.dex' | grep -a -q "com/pabloprieto/cine"; then echo "OK YouTubeCine dentro del APK"; else echo "FALTA YouTubeCine en el APK"; exit 1; fi
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump xmltree $A --file AndroidManifest.xml > build/avisos-log/manifiesto.txt
          for f in "org.godotengine.plugin.v2.EsperaOnline" "org.godotengine.plugin.v2.YouTubeCine" "com.pabloprieto.espera.EsperaService" "com.pabloprieto.espera.AvisoReceiver" "FOREGROUND_SERVICE_DATA_SYNC" "POST_NOTIFICATIONS" "android.permission.VIBRATE"; do
            if grep -q "$f" build/avisos-log/manifiesto.txt; then echo "OK manifiesto: $f"; else echo "FALTA en el manifiesto: $f"; exit 1; fi
          done
          # El icono de la notificación: sin él Android puede descartar el aviso.
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT2 dump resources $A | grep -q "ic_default_notification"; then echo "OK icono de la notificación"; else echo "FALTA el icono ic_default_notification"; exit 1; fi
          for r in drawable/ic_stat_achessway drawable/ic_large_achessway drawable/aviso_fondo drawable/aviso_pastilla layout/aviso_notif layout/aviso_notif_grande id/aviso_titulo id/aviso_pastilla; do
            if $AAPT2 dump resources $A | grep -q "$r"; then echo "OK recurso de aviso: $r"; else echo "FALTA el recurso de aviso $r"; exit 1; fi
          done
          # Icono propio y arranque sin el logo de Godot (solo informativo: nombres de recursos de la plantilla).
          $AAPT2 dump resources $A | grep -iE "mipmap/|splash|boot" | head -30 || true
          unzip -l $A | grep -iE "res/mipmap|res/drawable.*splash" | head -20 || true
          # Anuncios (plugin de Poing Studios): clases, ID de la app en el manifiesto y puente dentro del juego.
          if unzip -p $A 'classes*.dex' | grep -a -q "com/poingstudios/godot/admob"; then echo "OK AdMob dentro del APK"; else echo "FALTA AdMob en el APK"; exit 1; fi
          for f in "com.google.android.gms.ads.APPLICATION_ID" "org.godotengine.plugin.v2.PoingGodotAdMob"; do
            if grep -q "$f" build/avisos-log/manifiesto.txt; then echo "OK manifiesto: $f"; else echo "FALTA en el manifiesto: $f"; exit 1; fi
          done
          # Informativo: permiso del identificador de publicidad y versión objetivo de Android (Play exige la reciente).
          grep -n "AD_ID" build/avisos-log/manifiesto.txt || echo "(sin permiso AD_ID)"
          $AAPT2 dump badging $A | grep -E "^(sdkVersion|targetSdkVersion|compileSdkVersion)" || true
          T=$($AAPT2 dump badging $A | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          [ -n "$T" ] && [ "$T" -ge 35 ] || { echo "targetSdkVersion=$T: Play exige 35 o más"; exit 1; }
          # Sonido de la intro (importado por Godot: va como .oggvorbisstr dentro de .godot/imported).
          if grep -q "intro_sonido.ogg" build/avisos-log/apk-contenido.txt; then echo "OK sonido de la intro"; else echo "FALTA el sonido de la intro"; exit 1; fi
          for f in assets/data/demo_puzzles.json assets/data/defensas.json assets/data/version.json assets/data/curso.json assets/data/cine.json assets/data/ads.json assets/ui/iconos.json assets/intro/intro.ogv assets/espera/caballo_1.ogv assets/espera/caballo_2.ogv assets/espera/caballo_3.ogv assets/board3d/escudo.bin assets/board3d/escudo_roto.bin; do
            if grep -q " $f$" build/avisos-log/apk-contenido.txt; then echo "OK $f"; else echo "FALTA $f"; exit 1; fi
          done

      - name: Publicar el registro en la rama ci-avisos
        if: always()
        run: |
          cp import.log build/avisos-log/ 2>/dev/null || true
          cd build/avisos-log
          git init -q
          git checkout -q -b ci-avisos
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Registro del APK con avisos de ${GITHUB_SHA::7}" || true
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-avisos

      - name: Subir el APK con avisos
        uses: actions/upload-artifact@v4
        with:
          name: Chessome-avisos-debug-apk
          path: build/android/Chessome-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Enlace fijo de descarga directa del último APK de la rama principal (sin entrar en Actions).
      - name: APK en la versión preliminar «ultimo-apk»
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultimo-apk
          name: "A Chess Way · último APK de prueba"
          prerelease: true
          make_latest: false
          body: "APK de depuración (Gradle, con avisos y espera online), versión ${{ github.run_number }}, commit ${{ github.sha }}."
          files: build/android/Chessome-debug.apk
          overwrite_files: true

      # Paquete para Google Play (AAB), firmado con la CLAVE DE SUBIDA guardada en los secretos del repositorio
      # (UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS). Sin ellos, este paso se salta con un aviso.
      # Va después de publicar el APK para que un fallo aquí no lo bloquee. No se publica en abierto: es un artefacto
      # del flujo (hay que iniciar sesión en GitHub para bajarlo).
      - name: AAB para Play Console (firmado con la clave de subida)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          set -uo pipefail
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ] || [ -z "$UPLOAD_KEY_ALIAS" ]; then
            echo "::warning::Sin secretos de firma (UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS): no se genera el AAB."
            exit 0
          fi
          # Al pegar los secretos a mano se cuelan espacios y saltos de línea: se quitan (ninguno de los tres los lleva).
          UPLOAD_KEYSTORE_B64=$(printf %s "$UPLOAD_KEYSTORE_B64" | tr -d '[:space:]')
          UPLOAD_KEYSTORE_PASSWORD=$(printf %s "$UPLOAD_KEYSTORE_PASSWORD" | tr -d '[:space:]')
          UPLOAD_KEY_ALIAS=$(printf %s "$UPLOAD_KEY_ALIAS" | tr -d '[:space:]')
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/subida.keystore 2>/dev/null || echo "::warning::UPLOAD_KEYSTORE_B64 no es base64 válido"
          # Diagnóstico sin revelar nada: qué secreto falla si la firma no sale.
          echo "Diagnóstico de firma: texto del almacén ${#UPLOAD_KEYSTORE_B64} caracteres, alias ${#UPLOAD_KEY_ALIAS} caracteres"
          keytool -list -keystore $RUNNER_TEMP/subida.keystore -storepass "$UPLOAD_KEYSTORE_PASSWORD" > /dev/null 2>&1 && echo "Diagnóstico: el almacén se abre con la contraseña" || echo "::warning::Diagnóstico: el almacén NO se abre con la contraseña (revisar UPLOAD_KEYSTORE_B64 y UPLOAD_KEYSTORE_PASSWORD)"
          keytool -list -keystore $RUNNER_TEMP/subida.keystore -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" > /dev/null 2>&1 && echo "Diagnóstico: el alias existe" || echo "::warning::Diagnóstico: el alias NO existe en el almacén (revisar UPLOAD_KEY_ALIAS)"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/subida.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=$UPLOAD_KEY_ALIAS
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$UPLOAD_KEYSTORE_PASSWORD
          mkdir -p build/android build/aab-log
          B=$GITHUB_WORKSPACE/build/android/AChessWay-play.aab
          for i in 1 2 3; do
            ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --export-release "Android Play" $B > build/aab-log/export.log 2>&1 || true
            [ -f $B ] && break
            echo "Intento $i sin AAB"; grep -m3 -E "status code|What went wrong" build/aab-log/export.log || true
            sleep $((i * 60))
          done
          tail -40 build/aab-log/export.log
          ls -lh $B
          rm -f $RUNNER_TEMP/subida.keystore
          # Comprobaciones del paquete: firmado, con el juego, los datos y los anuncios.
          unzip -l $B > build/aab-log/aab-contenido.txt
          unzip -l $B | grep -E "META-INF/.*\.(RSA|SF)" || { echo "AAB sin firma"; exit 1; }
          for f in base/manifest/AndroidManifest.xml assets/data/cine.json assets/data/ads.json assets/data/curso.json; do
            grep -q "$f" build/aab-log/aab-contenido.txt && echo "OK $f" || { echo "FALTA $f en el AAB"; exit 1; }
          done
          unzip -p $B 'base/dex/*.dex' | grep -a -q "com/poingstudios/godot/admob" && echo "OK AdMob en el AAB" || { echo "FALTA AdMob en el AAB"; exit 1; }
          unzip -p $B 'base/dex/*.dex' | grep -a -q "com/pabloprieto/espera" && echo "OK EsperaOnline en el AAB" || { echo "FALTA EsperaOnline en el AAB"; exit 1; }
          unzip -p $B base/manifest/AndroidManifest.xml | grep -a -q "com.pabloprieto.chessome" && echo "OK paquete com.pabloprieto.chessome" || { echo "paquete distinto en el AAB"; exit 1; }
          # Play bloquea la versión si la pantalla vertical queda como función obligatoria (20 nov): debe ir declarada.
          unzip -p $B base/manifest/AndroidManifest.xml | grep -a -q "android.hardware.screen.portrait" && echo "OK screen.portrait declarada (opcional)" || { echo "FALTA uses-feature screen.portrait required=false en el AAB"; exit 1; }
          SIZE=$(stat -c %s $B); echo "AAB: $((SIZE/1024/1024)) MB"
          [ $SIZE -lt 200000000 ] || echo "::warning::El AAB supera 200 MB: Play pedirá Play Asset Delivery."

      - name: Subir el AAB
        uses: actions/upload-artifact@v4
        with:
          name: AChessWay-play-aab
          path: build/android/AChessWay-play.aab
          if-no-files-found: warn
          retention-days: 30
