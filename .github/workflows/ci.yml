name: CI

on:
  push:
    # «assets-fetch» y «sonidos-fetch» solo sirven para descargar candidatas (assets.yml, sonidos.yml).
    branches-ignore: [assets-fetch, assets-src, sonidos-fetch, assets-snd, problemas-fetch, problemas-src, voz-fetch, voz-src, voz-exp-fetch, voz-exp-src, firebase-prueba, firebase-resultado]
  pull_request:
  workflow_dispatch:

# Un empuje nuevo a la misma rama cancela la comprobación anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  web:
    name: Núcleo TypeScript y prototipo web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Incluye el test que comprueba que los datos de oro de Godot están al día con el núcleo TypeScript.
      - run: npm test
      - run: npm run build:single

      - name: Prototipo web en un solo archivo
        uses: actions/upload-artifact@v4
        with:
          name: chessome-web
          path: dist/chessome.html
          retention-days: 14

      # Web de pruebas en GitHub Pages, carpeta /app (la raíz es del cine): …github.io/Chesssome-/app/
      # Se conserva lo que ya haya en la rama gh-pages.
      - name: Web de pruebas en GitHub Pages (/app)
        if: github.ref == 'refs/heads/main'
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if ! git clone -q --depth 1 --branch gh-pages "$URL" _pages; then
            mkdir _pages && cd _pages && git init -q && git checkout -q -b gh-pages && git remote add origin "$URL" && cd ..
          fi
          mkdir -p _pages/app
          cp dist/chessome.html _pages/app/index.html
          touch _pages/.nojekyll
          cd _pages
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Web de pruebas (main): ${GITHUB_SHA::7}" || { echo "Sin cambios"; exit 0; }
          git push -q origin gh-pages

      # Enlace fijo de descarga del prototipo web (se abre desde el móvil; en un artefacto de Claude no puede conectar con Firebase).
      - name: Prototipo web en la versión preliminar «ultima-web»
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-web
          name: "A Chess Way · último prototipo web"
          prerelease: true
          make_latest: false
          body: "Prototipo web de un solo archivo (commit ${{ github.sha }}). Ábrelo en el navegador."
          files: dist/chessome.html
          overwrite_files: true

  godot:
    name: Godot (reglas y APK de depuración)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Caché de Godot y plantillas de Android
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Descargar Godot y plantillas (comprobando las sumas SHA-512 oficiales)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl/templates && cd ~/godot-dl
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          ED=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          TPZ=Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          W="wget -nv --tries=6 --waitretry=15 --retry-connrefused --retry-on-http-error=429,500,502,503,504"
          $W $BASE/SHA512-SUMS.txt
          $W $BASE/$ED
          $W $BASE/$TPZ
          grep -E "  ($ED|$TPZ)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q $ED && rm $ED
          unzip -q -j $TPZ templates/android_debug.apk templates/android_release.apk templates/version.txt -d templates/
          rm $TPZ
          ls -la ~/godot-dl ~/godot-dl/templates

      - name: Instalar plantillas, firma de depuración y ajustes del editor
        run: |
          set -euo pipefail
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T ~/.config/godot
          cp ~/godot-dl/templates/* $T/
          cat $T/version.txt
          # Firma de depuración fija (android_firma/): cada APK se instala encima del anterior.
          cp android_firma/debug.keystore ~/debug.keystore
          # versionCode creciente: Android solo actualiza a un versionCode igual o mayor.
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" godot/export_presets.cfg
          grep -E "^version/(code|name)" godot/export_presets.cfg
          # La app enseña su versión en Opciones: así se sabe qué APK está instalado.
          echo "{\"version\": \"0.1.${{ github.run_number }}\", \"commit\": \"${GITHUB_SHA::7}\"}" > godot/data/version.json
          cat godot/data/version.json
          V=$(echo $GODOT_VERSION | cut -d. -f1,2)
          for F in editor_settings-$V.tres editor_settings-4.tres; do
          cat > ~/.config/godot/$F <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Importar el proyecto
        run: |
          ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --import 2>&1 | tee import.log | tail -15 || true

      - name: Pruebas de oro (Glicko-2, reglas y explicaciones, frente al núcleo TypeScript y chess.js)
        run: |
          set -o pipefail
          G=~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          for T in test_glicko2 test_chess test_explain test_assessment test_course test_bot test_review test_online test_move_why test_game_detail test_game_log test_captures test_progress; do
            timeout 600 $G --headless --path godot -s tests/$T.gd 2>&1 | tee $T.log
            # un error de guion no siempre cambia el código de salida: se busca también en la salida
            ! grep -E -q "SCRIPT ERROR|Parse Error|Failed to load script" $T.log
            grep -q "TODO OK" $T.log
          done

      - name: Partida online en la demo (sin red)
        run: |
          set -o pipefail
          timeout 300 ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot -s tests/test_online_ui.gd 2>&1 | tee test_online_ui.log
          ! grep -E -q "SCRIPT ERROR|Parse Error|Failed to load script" test_online_ui.log
          grep -q "TODO OK" test_online_ui.log

      - name: APK de depuración (arm64)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android_firma/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build/android
          A=$GITHUB_WORKSPACE/build/android/Chessome-debug.apk
          ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --export-debug "Android Debug" $A 2>&1 | tail -30
          ls -lh $A
          # Lo que la app lee como archivo suelto tiene que ir dentro del APK.
          MISSING=0
          FIRST=$(python3 -c "import json; print(json.load(open('godot/data/demo_puzzles.json'))['puzzles'][0]['id'])")
          for f in assets/data/demo_puzzles.json assets/data/version.json assets/data/explain/$FIRST.json assets/sets/fichas/iconos.bin assets/ui/iconos.bin assets/ui/iconos.json assets/ui/emblema.bin assets/data/curso.json; do
            if unzip -l $A | grep -q " $f$"; then echo "OK $f"; else echo "FALTA $f"; MISSING=1; fi
          done
          [ "$MISSING" = 0 ]

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: Chessome-debug-apk
          path: build/android/Chessome-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Enlace fijo de descarga directa del último APK de la rama principal (sin entrar en Actions).
      - name: APK en la versión preliminar «ultimo-apk»
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultimo-apk
          name: "A Chess Way · último APK de prueba"
          prerelease: true
          make_latest: false
          body: "APK de depuración de la demo 3D (versión ${{ github.run_number }}, commit ${{ github.sha }})."
          files: build/android/Chessome-debug.apk
          overwrite_files: true

  # Capturas rápidas de las pantallas 2D (inicio, Entrenar, partida online): unos minutos, en cada cambio de Godot.
  pantallas:
    name: Pantallas 2D (capturas rápidas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Caché de Godot y plantillas de Android
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Descargar Godot (comprobando la suma SHA-512 oficial)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl && cd ~/godot-dl
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          ED=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          W="wget -nv --tries=6 --waitretry=15 --retry-connrefused --retry-on-http-error=429,500,502,503,504"
          $W $BASE/SHA512-SUMS.txt
          $W $BASE/$ED
          grep -E "  $ED$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q $ED && rm $ED

      - name: Renderizador por software (Vulkan) y pantalla virtual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri > /dev/null

      - name: Importar el proyecto
        run: |
          ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --import 2>&1 | tail -5 || true

      - name: Capturas de las pantallas
        run: |
          mkdir -p build/pantallas
          export SHOTS_DIR=$GITHUB_WORKSPACE/build/pantallas
          timeout 900 xvfb-run -a -s "-screen 0 1080x2400x24" ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --path godot --audio-driver Dummy --rendering-driver vulkan --rendering-method mobile --resolution 1080x2400 res://tests/pantallas.tscn > pantallas.log 2>&1 || true
          grep -E "^SHOT|SCRIPT ERROR|Parse Error|^ERROR|^   at:" pantallas.log | head -40 || true
          cp pantallas.log build/pantallas/

      - name: Publicar en la rama ci-pantallas
        if: always()
        run: |
          B=ci-pantallas
          if [ "$GITHUB_REF_NAME" != "main" ]; then B="ci-pantallas-${GITHUB_REF_NAME//\//-}"; fi
          cd build/pantallas
          git init -q
          git checkout -q -b "$B"
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Pantallas de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$B"

      - name: Las pantallas terminaron sin errores
        run: |
          grep -q "PANTALLAS DONE" pantallas.log || { tail -40 pantallas.log; exit 1; }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" pantallas.log; then exit 1; fi

  # Las capturas del 3D tardan mucho (render por CPU), así que van en paralelo y no retrasan el APK.
  # Solo se hacen si el cambio toca algo que afecta al 3D, o si se lanzan a mano (Run workflow).
  capturas:
    name: Capturas del tablero 3D
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Hay cambios que afecten al 3D?
        id: decide
        run: |
          set -u
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> $GITHUB_OUTPUT; echo "Lanzado a mano: se hacen capturas"; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> $GITHUB_OUTPUT; echo "Sin referencia anterior: se hacen capturas"; exit 0
          fi
          CAMBIOS=$(git diff --name-only "$BASE" "$GITHUB_SHA" || true)
          echo "$CAMBIOS"
          if echo "$CAMBIOS" | grep -E -q '^(godot/(board3d|core|ui|demo|sets|textures|fonts)/|godot/tests/shots\.(gd|tscn)$|godot/project\.godot$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> $GITHUB_OUTPUT; echo ">> Cambios en el 3D: se hacen capturas"
          else
            echo "run=false" >> $GITHUB_OUTPUT; echo ">> Sin cambios que afecten al 3D: se omiten las capturas"
          fi

      - name: Caché de Godot y plantillas de Android
        if: steps.decide.outputs.run == 'true'
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Descargar Godot y plantillas (comprobando las sumas SHA-512 oficiales)
        if: steps.decide.outputs.run == 'true' && steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl/templates && cd ~/godot-dl
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          ED=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          TPZ=Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          W="wget -nv --tries=6 --waitretry=15 --retry-connrefused --retry-on-http-error=429,500,502,503,504"
          $W $BASE/SHA512-SUMS.txt
          $W $BASE/$ED
          $W $BASE/$TPZ
          grep -E "  ($ED|$TPZ)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q $ED && rm $ED
          unzip -q -j $TPZ templates/android_debug.apk templates/android_release.apk templates/version.txt -d templates/
          rm $TPZ

      - name: Renderizador por software (Vulkan) y pantalla virtual
        if: steps.decide.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri > /dev/null

      - name: Importar el proyecto
        if: steps.decide.outputs.run == 'true'
        run: |
          ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --import 2>&1 | tee import.log | tail -15 || true

      - name: Capturas del tablero 3D
        if: steps.decide.outputs.run == 'true'
        run: |
          mkdir -p build/shots
          export SHOTS_DIR=$GITHUB_WORKSPACE/build/shots
          timeout 3600 xvfb-run -a -s "-screen 0 540x1200x24" ~/godot-dl/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --path godot --audio-driver Dummy --rendering-driver vulkan --rendering-method mobile --fixed-fps 30 --resolution 540x1200 res://tests/shots.tscn > shots.log 2>&1 || true
          grep -E "^SHOT|SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR|^   at:" shots.log | head -80 || true
          ls -la build/shots

      - name: Publicar capturas en la rama ci-shots
        if: always() && steps.decide.outputs.run == 'true'
        run: |
          mkdir -p build/shots
          cp shots.log import.log build/shots/ 2>/dev/null || true
          # main publica en ci-shots; las demás ramas, en ci-shots-<rama>, para que dos trabajos en paralelo no se pisen.
          SHOTS_BRANCH=ci-shots
          if [ "$GITHUB_REF_NAME" != "main" ]; then SHOTS_BRANCH="ci-shots-${GITHUB_REF_NAME//\//-}"; fi
          cd build/shots
          git init -q
          git checkout -q -b "$SHOTS_BRANCH"
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$SHOTS_BRANCH"

      - name: Las capturas terminaron y sin errores de guiones ni shaders
        if: steps.decide.outputs.run == 'true'
        run: |
          grep -q "SHOTS DONE" shots.log || { echo "Las capturas no terminaron"; tail -40 shots.log; exit 1; }
          if grep -E "SCRIPT ERROR|SHADER ERROR|Parse Error|Compile Error|Failed to load script" shots.log import.log; then exit 1; fi
